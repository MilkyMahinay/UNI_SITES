<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - UniConnect</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .dashboard-container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .dashboard-header h1 {
            color: var(--primary-color);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--surface);
            padding: 25px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .dashboard-sections {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
        }

        .dashboard-section {
            background: var(--surface);
            border-radius: 12px;
            padding: 30px;
            box-shadow: var(--shadow);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header h2 {
            color: var(--primary-color);
            margin: 0;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .item {
            padding: 15px;
            background: var(--background);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info {
            flex: 1;
        }

        .item-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .item-meta {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .item-actions {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: opacity 0.3s;
        }

        .btn-action:hover {
            opacity: 0.8;
        }

        .btn-delete {
            background-color: var(--danger-color);
            color: white;
        }

        .btn-approve {
            background-color: var(--success-color);
            color: white;
        }

        .btn-review {
            background-color: var(--accent-color);
            color: white;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-pending {
            background-color: #fef3c7;
            color: #d97706;
        }

        .badge-reviewed {
            background-color: #dcfce7;
            color: #16a34a;
        }

        .badge-resolved {
            background-color: #dbeafe;
            color: #2563eb;
        }

        .no-items {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .dashboard-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .dashboard-sections {
                grid-template-columns: 1fr;
            }

            .item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .item-actions {
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="../index.html">UniConnect</a>
            </div>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../feed.html">Feed</a></li>
                <li><a href="../events.html">Events</a></li>
                <li><a href="../feedback.html">Feedback</a></li>
                <li><a href="../ideas.html">Ideas</a></li>
                <li><a href="../profile.html">Profile</a></li>
                <li><a href="../logout.html" class="btn-login">Logout</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>Admin Dashboard</h1>
            <p>Welcome, <span id="adminName"></span></p>
        </div>

        <!-- Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalUsers">0</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalPosts">0</div>
                <div class="stat-label">Total Posts</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalEvents">0</div>
                <div class="stat-label">Total Events</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalFeedback">0</div>
                <div class="stat-label">Total Feedback</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalIdeas">0</div>
                <div class="stat-label">Total Ideas</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingFeedback">0</div>
                <div class="stat-label">Pending Feedback</div>
            </div>
        </div>

        <!-- Dashboard Sections -->
        <div class="dashboard-sections">
            <!-- Recent Posts -->
            <div class="dashboard-section">
                <div class="section-header">
                    <h2>Recent Posts</h2>
                </div>
                <div class="item-list" id="recentPosts"></div>
            </div>

            <!-- Recent Events -->
            <div class="dashboard-section">
                <div class="section-header">
                    <h2>Recent Events</h2>
                </div>
                <div class="item-list" id="recentEvents"></div>
            </div>

            <!-- Pending Feedback -->
            <div class="dashboard-section">
                <div class="section-header">
                    <h2>Pending Feedback</h2>
                </div>
                <div class="item-list" id="pendingFeedback"></div>
            </div>

            <!-- Recent Ideas -->
            <div class="dashboard-section">
                <div class="section-header">
                    <h2>Recent Ideas</h2>
                </div>
                <div class="item-list" id="recentIdeas"></div>
            </div>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/main.js"></script>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser || !currentUser.isAdmin) {
            window.location.href = '../login.html';
        }

        document.getElementById('adminName').textContent = `${currentUser.firstName} ${currentUser.lastName}`;

        function loadDashboard() {
            const stats = DB.getStats();
            document.getElementById('totalUsers').textContent = stats.totalUsers;
            document.getElementById('totalPosts').textContent = stats.totalPosts;
            document.getElementById('totalEvents').textContent = stats.totalEvents;
            document.getElementById('totalFeedback').textContent = stats.totalFeedback;
            document.getElementById('totalIdeas').textContent = stats.totalIdeas;
            document.getElementById('pendingFeedback').textContent = stats.pendingFeedback;

            // Recent Posts
            const posts = DB.getPosts().slice(0, 10);
            document.getElementById('recentPosts').innerHTML = posts.length === 0 
                ? '<div class="no-items">No posts yet</div>'
                : posts.map(post => {
                    const user = DB.findUserById(post.userId);
                    return `
                        <div class="item">
                            <div class="item-info">
                                <div class="item-title">${(post.caption || 'No caption').substring(0, 50)}...</div>
                                <div class="item-meta">By ${user.firstName} ${user.lastName} • ${new Date(post.createdAt).toLocaleDateString()}</div>
                            </div>
                            <div class="item-actions">
                                <button class="btn-action btn-delete" onclick="deletePost(${post.id})">Delete</button>
                            </div>
                        </div>
                    `;
                }).join('');

            // Recent Events
            const events = DB.getEvents().slice(0, 10);
            document.getElementById('recentEvents').innerHTML = events.length === 0
                ? '<div class="no-items">No events yet</div>'
                : events.map(event => {
                    const creator = DB.findUserById(event.createdBy);
                    return `
                        <div class="item">
                            <div class="item-info">
                                <div class="item-title">${event.title}</div>
                                <div class="item-meta">${new Date(event.eventDate).toLocaleDateString()} • Created by ${creator.firstName} ${creator.lastName}</div>
                            </div>
                            <div class="item-actions">
                                <button class="btn-action btn-delete" onclick="deleteEvent(${event.id})">Delete</button>
                            </div>
                        </div>
                    `;
                }).join('');

            // Pending Feedback
            const feedback = DB.getFeedback().filter(f => f.status === 'pending').slice(0, 10);
            document.getElementById('pendingFeedback').innerHTML = feedback.length === 0
                ? '<div class="no-items">No pending feedback</div>'
                : feedback.map(f => `
                    <div class="item">
                        <div class="item-info">
                            <div class="item-title">${f.subject}</div>
                            <div class="item-meta">${f.category.charAt(0).toUpperCase() + f.category.slice(1)} • ${new Date(f.createdAt).toLocaleDateString()}</div>
                        </div>
                        <div class="item-actions">
                            <button class="btn-action btn-review" onclick="updateFeedbackStatus(${f.id}, 'reviewed')">Mark Reviewed</button>
                            <button class="btn-action btn-approve" onclick="updateFeedbackStatus(${f.id}, 'resolved')">Mark Resolved</button>
                        </div>
                    </div>
                `).join('');

            // Recent Ideas
            const ideas = DB.getIdeas().slice(0, 10);
            document.getElementById('recentIdeas').innerHTML = ideas.length === 0
                ? '<div class="no-items">No ideas yet</div>'
                : ideas.map(idea => {
                    const author = DB.findUserById(idea.userId);
                    return `
                        <div class="item">
                            <div class="item-info">
                                <div class="item-title">${idea.title}</div>
                                <div class="item-meta">${idea.votes} votes • By ${author.firstName} ${author.lastName}</div>
                            </div>
                            <div class="item-actions">
                                <a href="../ideas.html" class="btn-action btn-review">View</a>
                            </div>
                        </div>
                    `;
                }).join('');
        }

        function deletePost(postId) {
            if (confirm('Delete this post?')) {
                DB.deletePost(postId);
                loadDashboard();
            }
        }

        function deleteEvent(eventId) {
            if (confirm('Delete this event?')) {
                DB.deleteEvent(eventId);
                loadDashboard();
            }
        }

        function updateFeedbackStatus(feedbackId, status) {
            DB.updateFeedbackStatus(feedbackId, status);
            loadDashboard();
        }

        loadDashboard();
    </script>
</body>
</html>
