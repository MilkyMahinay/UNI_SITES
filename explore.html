<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore - UniConnect</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .explore-container {
            max-width: 935px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .explore-header {
            margin-bottom: 30px;
        }

        .explore-header h1 {
            font-size: 2rem;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .explore-header p {
            color: var(--text-secondary);
        }

        .explore-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .explore-tab {
            background: none;
            border: none;
            font-size: 1rem;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .explore-tab:hover {
            color: var(--text-primary);
        }

        .explore-tab.active {
            background: var(--primary-color);
            color: white;
        }

        .explore-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
        }

        .explore-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform 0.3s;
        }

        .explore-item:hover {
            transform: scale(1.02);
        }

        .explore-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .explore-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .explore-item:hover .explore-overlay {
            opacity: 1;
        }

        .explore-stats {
            color: white;
            font-weight: 600;
            display: flex;
            gap: 20px;
            font-size: 1.1rem;
        }

        .explore-stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .explore-user {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: 0.85rem;
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .no-posts {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        /* Post Modal */
        .post-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .post-modal.active {
            display: flex;
        }

        .post-modal-content {
            background: var(--surface);
            border-radius: 8px;
            max-width: 900px;
            width: 90%;
            max-height: 90vh;
            display: flex;
            overflow: hidden;
        }

        .post-modal-image {
            flex: 1;
            background: var(--background);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }

        .post-modal-image img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
        }

        .post-modal-details {
            width: 350px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border);
        }

        .post-modal-header {
            display: flex;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 15px;
        }

        .post-modal-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 10px;
        }

        .post-modal-username {
            font-weight: 600;
            color: var(--text-primary);
        }

        .post-modal-caption {
            flex: 1;
            overflow-y: auto;
            color: var(--text-primary);
            line-height: 1.5;
        }

        .post-modal-actions {
            padding-top: 15px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 20px;
        }

        .post-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .explore-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 3px;
            }

            .explore-container {
                padding: 0 10px;
            }

            .post-modal-content {
                flex-direction: column;
                max-height: 95vh;
            }

            .post-modal-image {
                flex: none;
                max-height: 50vh;
            }

            .post-modal-details {
                width: 100%;
                border-left: none;
                border-top: 1px solid var(--border);
            }
        }

        @media (max-width: 480px) {
            .explore-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 2px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html">UniConnect</a>
            </div>
            <div class="nav-search">
                <input type="text" id="searchInput" placeholder="Search users, posts, hashtags..." onkeyup="handleSearch(event)">
                <div id="searchResults" class="search-results"></div>
            </div>
            <div class="nav-notifications">
                <button class="notification-btn" onclick="toggleNotifications()">
                    🔔
                    <span class="notification-badge" id="notificationBadge"></span>
                </button>
                <div class="notifications-panel" id="notificationsPanel">
                    <div class="notifications-header">
                        <h3>Notifications</h3>
                        <button class="mark-read-btn" onclick="markAllRead()">Mark all as read</button>
                    </div>
                    <div class="notifications-list" id="notificationsList"></div>
                </div>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="feed.html">Feed</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="feedback.html">Feedback</a></li>
                <li><a href="ideas.html">Ideas</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="explore.html" class="active">Explore</a></li>
                <li><a href="logout.html" class="btn-login">Logout</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <div class="explore-container">
        <div class="explore-header">
            <h1>Explore</h1>
            <p>Discover posts from the university community</p>
        </div>

        <div class="explore-tabs">
            <button class="explore-tab active" onclick="filterExplore('all')">All Posts</button>
            <button class="explore-tab" onclick="filterExplore('popular')">Popular</button>
            <button class="explore-tab" onclick="filterExplore('recent')">Recent</button>
        </div>

        <div class="explore-grid" id="exploreGrid"></div>
    </div>

    <!-- Post Modal -->
    <div class="post-modal" id="postModal">
        <button class="post-modal-close" onclick="closePostModal()">×</button>
        <div class="post-modal-content">
            <div class="post-modal-image">
                <img id="modalPostImage" src="" alt="Post">
            </div>
            <div class="post-modal-details">
                <div class="post-modal-header">
                    <img id="modalPostAvatar" src="" alt="User" class="post-modal-avatar">
                    <div id="modalPostUsername" class="post-modal-username"></div>
                </div>
                <div id="modalPostCaption" class="post-modal-caption"></div>
                <div class="post-modal-actions">
                    <button class="action-btn" onclick="toggleModalLike()">❤️</button>
                    <button class="action-btn">💬</button>
                    <button class="action-btn">📤</button>
                    <button class="action-btn">🔖</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'login.html';
        }

        let currentFilter = 'all';
        let currentModalPost = null;

        function loadExplorePosts() {
            const posts = DB.getPosts();
            const container = document.getElementById('exploreGrid');

            let filteredPosts = posts;

            if (currentFilter === 'popular') {
                // Sort by likes count
                filteredPosts = posts.sort((a, b) => {
                    const likesA = DB.getLikeCount(a.id);
                    const likesB = DB.getLikeCount(b.id);
                    return likesB - likesA;
                });
            } else if (currentFilter === 'recent') {
                // Sort by date (newest first)
                filteredPosts = posts.sort((a, b) => {
                    return new Date(b.createdAt) - new Date(a.createdAt);
                });
            }

            if (filteredPosts.length === 0) {
                container.innerHTML = '<div class="no-posts"><h2>No posts to explore</h2><p>Be the first to share something with the community!</p></div>';
                return;
            }

            container.innerHTML = filteredPosts.map(post => {
                const user = DB.findUserById(post.userId);
                const likeCount = DB.getLikeCount(post.id);
                const commentCount = DB.getCommentsByPost(post.id).length;
                const imageSrc = post.imagePath ? (Array.isArray(post.imagePath) ? post.imagePath[0] : post.imagePath) : 'https://via.placeholder.com/300?text=No+Image';

                return `
                    <div class="explore-item" onclick="openPostModal(${post.id})">
                        <img src="${imageSrc}" alt="Post" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
                        <div class="explore-overlay">
                            <div class="explore-stats">
                                <div class="explore-stat-item">❤️ ${likeCount}</div>
                                <div class="explore-stat-item">💬 ${commentCount}</div>
                            </div>
                        </div>
                        <div class="explore-user">@${user.firstName.toLowerCase()}${user.lastName.toLowerCase()}</div>
                    </div>
                `;
            }).join('');
        }

        function filterExplore(filter) {
            currentFilter = filter;

            // Update tab styles
            document.querySelectorAll('.explore-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            loadExplorePosts();
        }

        function openPostModal(postId) {
            const post = DB.getPosts().find(p => p.id === postId);
            if (!post) return;

            currentModalPost = post;
            const user = DB.findUserById(post.userId);

            document.getElementById('modalPostImage').src = post.imagePath ? (Array.isArray(post.imagePath) ? post.imagePath[0] : post.imagePath) : 'https://via.placeholder.com/600?text=No+Image';
            document.getElementById('modalPostAvatar').src = user.profilePicture || 'https://via.placeholder.com/40?text=User';
            document.getElementById('modalPostUsername').textContent = `@${user.firstName.toLowerCase()}${user.lastName.toLowerCase()}`;
            document.getElementById('modalPostCaption').textContent = post.caption || 'No caption';

            document.getElementById('postModal').classList.add('active');
        }

        function closePostModal() {
            document.getElementById('postModal').classList.remove('active');
            currentModalPost = null;
        }

        function toggleModalLike() {
            if (currentModalPost) {
                DB.toggleLike(currentModalPost.id, currentUser.id);
                loadExplorePosts();
            }
        }

        // Close modal when clicking outside
        document.getElementById('postModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closePostModal();
            }
        });

        // Initial load
        loadExplorePosts();
        loadNotifications();

        // Close search results when clicking outside
        document.addEventListener('click', function(e) {
            const searchResults = document.getElementById('searchResults');
            const searchInput = document.getElementById('searchInput');
            if (searchResults && !e.target.closest('.nav-search')) {
                searchResults.classList.remove('active');
            }

            // Close notifications panel when clicking outside
            const notificationsPanel = document.getElementById('notificationsPanel');
            const notificationBtn = document.querySelector('.notification-btn');
            if (notificationsPanel && !e.target.closest('.nav-notifications')) {
                notificationsPanel.classList.remove('active');
            }
        });

        // Notifications functionality
        function loadNotifications() {
            const notifications = DB.getNotifications().filter(n => n.userId === currentUser.id);
            const unreadCount = notifications.filter(n => !n.read).length;

            const badge = document.getElementById('notificationBadge');
            if (badge) {
                badge.textContent = unreadCount > 9 ? '9+' : unreadCount;
                badge.classList.toggle('active', unreadCount > 0);
            }

            const notificationsList = document.getElementById('notificationsList');
            if (notificationsList) {
                if (notifications.length === 0) {
                    notificationsList.innerHTML = '<div class="no-notifications">No notifications</div>';
                } else {
                    notificationsList.innerHTML = notifications.map(notification => {
                        const icon = getNotificationIcon(notification.type);
                        const timeAgo = getTimeAgo(notification.createdAt);
                        return `
                            <div class="notification-item ${notification.read ? '' : 'unread'}" onclick="handleNotificationClick(${notification.id})">
                                <div style="display: flex; align-items: flex-start;">
                                    <span class="notification-icon">${icon}</span>
                                    <div class="notification-content">
                                        <div class="notification-text">${notification.message}</div>
                                        <div class="notification-time">${timeAgo}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            }
        }

        function getNotificationIcon(type) {
            const icons = {
                like: '❤️',
                comment: '💬',
                follow: '👤',
                event: '📅',
                save: '🔖',
                share: '📤'
            };
            return icons[type] || '🔔';
        }

        function toggleNotifications() {
            const panel = document.getElementById('notificationsPanel');
            panel.classList.toggle('active');
        }

        function handleNotificationClick(notificationId) {
            DB.markNotificationAsRead(notificationId);
            loadNotifications();
        }

        function markAllRead() {
            DB.markAllNotificationsAsRead(currentUser.id);
            loadNotifications();
        }

        function getTimeAgo(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);

            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
            if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
            if (seconds < 604800) return Math.floor(seconds / 86400) + 'd ago';
            return date.toLocaleDateString();
        }

        // Search functionality
        function handleSearch(event) {
            const query = event.target.value.trim().toLowerCase();
            const searchResults = document.getElementById('searchResults');

            if (query.length < 2) {
                searchResults.classList.remove('active');
                return;
            }

            const results = performSearch(query);
            displaySearchResults(results, searchResults);
        }

        function performSearch(query) {
            const results = {
                users: [],
                posts: [],
                hashtags: []
            };

            const users = DB.getUsers();
            results.users = users.filter(user => {
                const fullName = `${user.firstName} ${user.lastName}`.toLowerCase();
                const username = `${user.firstName.toLowerCase()}${user.lastName.toLowerCase()}`;
                return fullName.includes(query) || username.includes(query);
            }).slice(0, 5);

            const posts = DB.getPosts();
            results.posts = posts.filter(post => {
                const caption = (post.caption || '').toLowerCase();
                return caption.includes(query);
            }).slice(0, 5);

            const allPosts = DB.getPosts();
            const allHashtags = new Set();
            allPosts.forEach(post => {
                const hashtags = (post.caption || '').match(/#\w+/g) || [];
                hashtags.forEach(tag => allHashtags.add(tag.toLowerCase()));
            });

            results.hashtags = Array.from(allHashtags)
                .filter(tag => tag.includes(query))
                .slice(0, 5);

            return results;
        }

        function displaySearchResults(results, container) {
            let html = '';

            if (results.users.length === 0 && results.posts.length === 0 && results.hashtags.length === 0) {
                html = '<div class="no-search-results">No results found</div>';
            } else {
                if (results.users.length > 0) {
                    html += '<div class="search-result-type">Users</div>';
                    results.users.forEach(user => {
                        html += `
                            <div class="search-result-item" onclick="goToProfile(${user.id})">
                                <div class="search-result-name">${user.firstName} ${user.lastName}</div>
                                <div class="search-result-details">@${user.firstName.toLowerCase()}${user.lastName.toLowerCase()}</div>
                            </div>
                        `;
                    });
                }

                if (results.posts.length > 0) {
                    html += '<div class="search-result-type">Posts</div>';
                    results.posts.forEach(post => {
                        const user = DB.findUserById(post.userId);
                        const caption = post.caption ? post.caption.substring(0, 50) + (post.caption.length > 50 ? '...' : '') : 'No caption';
                        html += `
                            <div class="search-result-item" onclick="goToPost(${post.id})">
                                <div class="search-result-name">${user.firstName} ${user.lastName}</div>
                                <div class="search-result-details">${caption}</div>
                            </div>
                        `;
                    });
                }

                if (results.hashtags.length > 0) {
                    html += '<div class="search-result-type">Hashtags</div>';
                    results.hashtags.forEach(tag => {
                        html += `
                            <div class="search-result-item" onclick="searchHashtag('${tag}')">
                                <div class="search-result-name">${tag}</div>
                                <div class="search-result-details">Click to search posts with this hashtag</div>
                            </div>
                        `;
                    });
                }
            }

            container.innerHTML = html;
            container.classList.add('active');
        }

        function goToProfile(userId) {
            if (currentUser && currentUser.id === userId) {
                window.location.href = 'profile.html';
            } else {
                window.location.href = 'profile.html';
            }
            document.getElementById('searchResults').classList.remove('active');
        }

        function goToPost(postId) {
            window.location.href = `feed.html?post=${postId}`;
            document.getElementById('searchResults').classList.remove('active');
        }

        function searchHashtag(tag) {
            document.getElementById('searchInput').value = tag;
            handleSearch({ target: { value: tag } });
        }
    </script>
</body>
</html>
