<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - UniConnect</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .profile-header {
            background: var(--surface);
            border-radius: 12px;
            padding: 40px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .profile-picture {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-color);
            background-color: var(--border);
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .profile-details {
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .profile-details p {
            margin-bottom: 5px;
        }

        .profile-bio {
            background: var(--background);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .profile-interests {
            color: var(--primary-color);
            font-weight: 500;
        }

        .btn-edit {
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        .btn-edit:hover {
            background-color: var(--primary-dark);
        }

        .edit-form {
            background: var(--surface);
            border-radius: 12px;
            padding: 30px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            display: none;
        }

        .edit-form.active {
            display: block;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .post-card {
            background: var(--surface);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s;
        }

        .post-card:hover {
            transform: translateY(-5px);
        }

        .post-content {
            padding: 15px;
        }

        .post-caption {
            color: var(--text-primary);
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .post-meta {
            color: var(--text-secondary);
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

        .no-posts {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .success {
            background-color: #dcfce7;
            color: #16a34a;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #16a34a;
        }

        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .posts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html">UniConnect</a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="feed.html">Feed</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="feedback.html">Feedback</a></li>
                <li><a href="ideas.html">Ideas</a></li>
                <li><a href="profile.html" class="active">Profile</a></li>
                <li><a href="logout.html" class="btn-login">Logout</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <div class="profile-container">
        <div id="success" class="success" style="display: none;"></div>

        <div class="profile-header">
            <img id="profilePicture" src="images/default-avatar.png" alt="Profile Picture" class="profile-picture" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
            <div class="profile-info">
                <h1 id="profileName" class="profile-name"></h1>
                <div class="profile-details">
                    <p><strong>Course:</strong> <span id="profileCourse"></span></p>
                    <p><strong>Year:</strong> <span id="profileYear"></span></p>
                    <p><strong>Member since:</strong> <span id="profileJoined"></span></p>
                </div>
                <div id="profileBio" class="profile-bio" style="display: none;"></div>
                <p id="profileInterests" class="profile-interests" style="display: none;"></p>
                <button class="btn-edit" onclick="toggleEditForm()">Edit Profile</button>
            </div>
        </div>

        <div class="edit-form" id="editForm">
            <h2 class="section-title">Edit Profile</h2>
            <form id="editProfileForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="course">Course/Program</label>
                        <input type="text" id="course" name="course">
                    </div>
                    <div class="form-group">
                        <label for="yearOfStudy">Year of Study</label>
                        <select id="yearOfStudy" name="yearOfStudy">
                            <option value="">Select Year</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                            <option value="5">5th Year</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio" name="bio" placeholder="Tell us about yourself..."></textarea>
                </div>

                <div class="form-group">
                    <label for="interests">Interests (comma-separated)</label>
                    <input type="text" id="interests" name="interests" placeholder="e.g., Sports, Music, Technology">
                </div>

                <button type="submit" class="btn-edit">Save Changes</button>
            </form>
        </div>

        <h2 class="section-title">My Posts</h2>
        <div id="postsContainer" class="posts-grid"></div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'login.html';
        }

        function loadProfile() {
            const user = DB.findUserById(currentUser.id);
            
            document.getElementById('profileName').textContent = `${user.firstName} ${user.lastName}`;
            document.getElementById('profileCourse').textContent = user.course || 'Not specified';
            document.getElementById('profileYear').textContent = user.yearOfStudy ? `${user.yearOfStudy} Year` : 'Not specified';
            document.getElementById('profileJoined').textContent = new Date(user.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long' });
            
            if (user.bio) {
                document.getElementById('profileBio').textContent = user.bio;
                document.getElementById('profileBio').style.display = 'block';
            }
            
            if (user.interests) {
                document.getElementById('profileInterests').textContent = `Interests: ${user.interests}`;
                document.getElementById('profileInterests').style.display = 'block';
            }

            // Fill edit form
            document.getElementById('firstName').value = user.firstName;
            document.getElementById('lastName').value = user.lastName;
            document.getElementById('course').value = user.course || '';
            document.getElementById('yearOfStudy').value = user.yearOfStudy || '';
            document.getElementById('bio').value = user.bio || '';
            document.getElementById('interests').value = user.interests || '';

            // Load user's posts
            const posts = DB.getPosts().filter(p => p.userId === currentUser.id);
            const container = document.getElementById('postsContainer');

            if (posts.length === 0) {
                container.innerHTML = '<div class="no-posts"><p>You haven\'t posted anything yet. <a href="feed.html">Go to the feed</a> to share your first post!</p></div>';
            } else {
                container.innerHTML = posts.map(post => {
                    const likeCount = DB.getLikeCount(post.id);
                    return `
                        <div class="post-card">
                            <div class="post-content">
                                <p class="post-caption">${post.caption || 'No caption'}</p>
                                <div class="post-meta">
                                    <span>${new Date(post.createdAt).toLocaleDateString()}</span>
                                    <span>❤️ ${likeCount}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function toggleEditForm() {
            document.getElementById('editForm').classList.toggle('active');
        }

        document.getElementById('editProfileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const updates = {
                firstName: document.getElementById('firstName').value.trim(),
                lastName: document.getElementById('lastName').value.trim(),
                course: document.getElementById('course').value.trim(),
                yearOfStudy: document.getElementById('yearOfStudy').value,
                bio: document.getElementById('bio').value.trim(),
                interests: document.getElementById('interests').value.trim()
            };

            DB.updateUser(currentUser.id, updates);

            // Update current user session
            currentUser.firstName = updates.firstName;
            currentUser.lastName = updates.lastName;
            localStorage.setItem('currentUser', JSON.stringify(currentUser));

            document.getElementById('success').textContent = 'Profile updated successfully!';
            document.getElementById('success').style.display = 'block';
            document.getElementById('editForm').classList.remove('active');

            loadProfile();
        });

        loadProfile();
    </script>
</body>
</html>
