<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - UniConnect</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile-container {
            max-width: 935px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .profile-header {
            background: var(--surface);
            border-radius: 8px;
            padding: 30px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .profile-picture {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border);
            background-color: var(--border);
            margin-right: 30px;
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: var(--text-primary);
            font-weight: 300;
        }

        .profile-username {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-weight: 400;
        }

        .profile-stats {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .profile-stat {
            color: var(--text-primary);
        }

        .profile-stat strong {
            font-weight: 600;
        }

        .profile-bio {
            color: var(--text-primary);
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .profile-course {
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .profile-interests {
            color: var(--primary-color);
            font-size: 0.95rem;
        }

        .btn-edit {
            padding: 8px 16px;
            background-color: var(--background);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s;
            margin-top: 15px;
        }

        .btn-edit:hover {
            background-color: var(--border);
        }

        .edit-form {
            background: var(--surface);
            border-radius: 8px;
            padding: 30px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            display: none;
        }

        .edit-form.active {
            display: block;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Profile Tabs */
        .profile-tabs {
            background: var(--surface);
            border-radius: 8px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            display: flex;
            border-bottom: 1px solid var(--border);
        }

        .profile-tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 500;
            transition: all 0.3s;
            border-bottom: 1px solid transparent;
        }

        .profile-tab:hover {
            color: var(--text-primary);
        }

        .profile-tab.active {
            color: var(--text-primary);
            border-bottom: 1px solid var(--text-primary);
        }

        .profile-tab span {
            margin-right: 5px;
        }

        .section-title {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--text-primary);
            font-weight: 600;
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
        }

        .post-card {
            background: var(--surface);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: var(--shadow);
            aspect-ratio: 1;
            cursor: pointer;
            position: relative;
        }

        .post-card:hover {
            transform: scale(1.02);
            transition: transform 0.2s;
        }

        .post-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .post-card:hover .post-overlay {
            opacity: 1;
        }

        .post-stats-overlay {
            color: white;
            font-weight: 600;
            display: flex;
            gap: 20px;
        }

        .post-stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .post-content {
            padding: 15px;
        }

        .post-caption {
            color: var(--text-primary);
            margin-bottom: 10px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .post-meta {
            color: var(--text-secondary);
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
        }

        .no-posts {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .success {
            background-color: #dcfce7;
            color: #16a34a;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #16a34a;
        }

        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 20px;
            }

            .profile-picture {
                margin-right: 0;
                margin-bottom: 20px;
                width: 120px;
                height: 120px;
            }

            .profile-stats {
                justify-content: center;
                gap: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .posts-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 3px;
            }

            .profile-name {
                font-size: 1.5rem;
            }

            .profile-tabs {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            .posts-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 2px;
            }

            .profile-container {
                padding: 0 10px;
            }

            .profile-header {
                padding: 15px;
            }

            .profile-picture {
                width: 100px;
                height: 100px;
            }

            .profile-name {
                font-size: 1.3rem;
            }

            .profile-stats {
                gap: 15px;
                font-size: 0.9rem;
            }

            .btn-edit {
                padding: 8px 16px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html">UniConnect</a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="feed.html">Feed</a></li>
                <li><a href="explore.html">Explore</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="feedback.html">Feedback</a></li>
                <li><a href="ideas.html">Ideas</a></li>
                <li><a href="profile.html" class="active">Profile</a></li>
                <li><a href="logout.html" class="btn-login">Logout</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <div class="profile-container">
        <div id="success" class="success" style="display: none;"></div>

        <div class="profile-header">
            <img id="profilePicture" src="https://via.placeholder.com/150?text=User" alt="Profile Picture" class="profile-picture" onerror="this.src='https://via.placeholder.com/150?text=User'">
            <div class="profile-info">
                <h1 id="profileName" class="profile-name"></h1>
                <div id="profileUsername" class="profile-username"></div>
                <div class="profile-stats">
                    <div class="profile-stat"><strong id="postCount">0</strong> posts</div>
                    <div class="profile-stat"><strong id="followerCount">0</strong> followers</div>
                    <div class="profile-stat"><strong id="followingCount">0</strong> following</div>
                </div>
                <div id="profileBio" class="profile-bio"></div>
                <div id="profileCourse" class="profile-course"></div>
                <div id="profileInterests" class="profile-interests"></div>
                <button class="btn-edit" onclick="toggleEditForm()">Edit Profile</button>
            </div>
        </div>

        <div class="edit-form" id="editForm">
            <h2 class="section-title">Edit Profile</h2>
            <form id="editProfileForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="course">Course/Program</label>
                        <input type="text" id="course" name="course">
                    </div>
                    <div class="form-group">
                        <label for="yearOfStudy">Year of Study</label>
                        <select id="yearOfStudy" name="yearOfStudy">
                            <option value="">Select Year</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                            <option value="5">5th Year</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio" name="bio" placeholder="Tell us about yourself..."></textarea>
                </div>

                <div class="form-group">
                    <label for="interests">Interests (comma-separated)</label>
                    <input type="text" id="interests" name="interests" placeholder="e.g., Sports, Music, Technology">
                </div>

                <button type="submit" class="btn-edit">Save Changes</button>
            </form>
        </div>

        <div class="profile-tabs">
            <div class="profile-tab active" onclick="switchTab('posts')">
                <span>📷</span> POSTS
            </div>
            <div class="profile-tab" onclick="switchTab('saved')">
                <span>🔖</span> SAVED
            </div>
        </div>

        <div id="postsTab">
            <h2 class="section-title">My Posts</h2>
            <div id="postsContainer" class="posts-grid"></div>
        </div>

        <div id="savedTab" style="display: none;">
            <h2 class="section-title">Saved Posts</h2>
            <div id="savedContainer" class="posts-grid"></div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'login.html';
        }

        function loadProfile() {
            const user = DB.findUserById(currentUser.id);

            document.getElementById('profileName').textContent = `${user.firstName} ${user.lastName}`;
            document.getElementById('profileUsername').textContent = `@${user.firstName.toLowerCase()}${user.lastName.toLowerCase()}`;

            // Load stats
            const posts = DB.getPosts().filter(p => p.userId === currentUser.id);
            const followers = DB.getFollowers().filter(f => f.followingId === currentUser.id);
            const following = DB.getFollowers().filter(f => f.followerId === currentUser.id);

            document.getElementById('postCount').textContent = posts.length;
            document.getElementById('followerCount').textContent = followers.length;
            document.getElementById('followingCount').textContent = following.length;

            // Profile details
            if (user.bio) {
                document.getElementById('profileBio').textContent = user.bio;
            }

            if (user.course) {
                document.getElementById('profileCourse').textContent = `${user.course}${user.yearOfStudy ? ' • ' + user.yearOfStudy + ' Year' : ''}`;
            }

            if (user.interests) {
                document.getElementById('profileInterests').textContent = user.interests;
            }

            // Profile picture
            if (user.profilePicture) {
                document.getElementById('profilePicture').src = user.profilePicture;
            }

            // Fill edit form
            document.getElementById('firstName').value = user.firstName;
            document.getElementById('lastName').value = user.lastName;
            document.getElementById('course').value = user.course || '';
            document.getElementById('yearOfStudy').value = user.yearOfStudy || '';
            document.getElementById('bio').value = user.bio || '';
            document.getElementById('interests').value = user.interests || '';

            // Load user's posts
            loadUserPosts();
            loadSavedPosts();
        }

        function loadUserPosts() {
            const posts = DB.getPosts().filter(p => p.userId === currentUser.id);
            const container = document.getElementById('postsContainer');

            if (posts.length === 0) {
                container.innerHTML = '<div class="no-posts"><p>You haven\'t posted anything yet. <a href="feed.html">Go to the feed</a> to share your first post!</p></div>';
            } else {
                container.innerHTML = posts.map(post => {
                    const likeCount = DB.getLikeCount(post.id);
                    const commentCount = DB.getCommentsByPost(post.id).length;
                    return `
                        <div class="post-card" onclick="viewPost(${post.id})">
                            ${post.imagePath ? `<img src="${post.imagePath}" alt="Post" class="post-image">` : '<div class="post-image" style="background: var(--background); display: flex; align-items: center; justify-content: center; color: var(--text-secondary);">No image</div>'}
                            <div class="post-overlay">
                                <div class="post-stats-overlay">
                                    <div class="post-stat-item">❤️ ${likeCount}</div>
                                    <div class="post-stat-item">💬 ${commentCount}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function loadSavedPosts() {
            const savedPosts = DB.getSavedPostsByUser(currentUser.id);
            const container = document.getElementById('savedContainer');

            if (savedPosts.length === 0) {
                container.innerHTML = '<div class="no-posts"><p>No saved posts yet. Save posts from the feed to see them here!</p></div>';
            } else {
                container.innerHTML = savedPosts.map(post => {
                    const likeCount = DB.getLikeCount(post.id);
                    const commentCount = DB.getCommentsByPost(post.id).length;
                    const postUser = DB.findUserById(post.userId);
                    return `
                        <div class="post-card" onclick="viewPost(${post.id})">
                            ${post.imagePath ? `<img src="${post.imagePath}" alt="Post" class="post-image">` : '<div class="post-image" style="background: var(--background); display: flex; align-items: center; justify-content: center; color: var(--text-secondary);">No image</div>'}
                            <div class="post-overlay">
                                <div class="post-stats-overlay">
                                    <div class="post-stat-item">❤️ ${likeCount}</div>
                                    <div class="post-stat-item">💬 ${commentCount}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function switchTab(tab) {
            // Update tab styles
            document.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
            event.target.closest('.profile-tab').classList.add('active');

            // Show/hide content
            if (tab === 'posts') {
                document.getElementById('postsTab').style.display = 'block';
                document.getElementById('savedTab').style.display = 'none';
            } else {
                document.getElementById('postsTab').style.display = 'none';
                document.getElementById('savedTab').style.display = 'block';
            }
        }

        function viewPost(postId) {
            // For now, redirect to feed with post ID
            window.location.href = `feed.html?post=${postId}`;
        }

        function toggleEditForm() {
            document.getElementById('editForm').classList.toggle('active');
        }

        document.getElementById('editProfileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const updates = {
                firstName: document.getElementById('firstName').value.trim(),
                lastName: document.getElementById('lastName').value.trim(),
                course: document.getElementById('course').value.trim(),
                yearOfStudy: document.getElementById('yearOfStudy').value,
                bio: document.getElementById('bio').value.trim(),
                interests: document.getElementById('interests').value.trim()
            };

            DB.updateUser(currentUser.id, updates);

            // Update current user session
            currentUser.firstName = updates.firstName;
            currentUser.lastName = updates.lastName;
            localStorage.setItem('currentUser', JSON.stringify(currentUser));

            document.getElementById('success').textContent = 'Profile updated successfully!';
            document.getElementById('success').style.display = 'block';
            document.getElementById('editForm').classList.remove('active');

            loadProfile();
        });

        loadProfile();
    </script>
</body>
</html>
